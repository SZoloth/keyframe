name: Keyframe
options:
  bundleIdPrefix: com.szoloth
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.4"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Keyframe:
    type: application
    platform: macOS
    sources:
      - path: Keyframe
        excludes:
          - Resources/Keyframe.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szoloth.keyframe
        PRODUCT_NAME: Keyframe
        INFOPLIST_FILE: Keyframe/Resources/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Keyframe/Resources/Keyframe.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: DialKit
    entitlements:
      path: Keyframe/Resources/Keyframe.entitlements
    info:
      path: Keyframe/Resources/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.keyframe.project
            UTTypeDescription: Keyframe Project
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - keyframe
        CFBundleDocumentTypes:
          - CFBundleTypeName: Keyframe Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.keyframe.project

  KeyframeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KeyframeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szoloth.keyframe.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Keyframe

packages:
  DialKit:
    url: https://github.com/mikelikesdesign/dialkit-ios
    branch: main
